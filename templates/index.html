<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEIJI | Key Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; background-image: radial-gradient(circle at top right, #1e1b4b 0%, transparent 40%); }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .toggle { appearance: none; width: 48px; height: 26px; background-color: #ef4444; border-radius: 26px; position: relative; cursor: pointer; outline: none; transition: all 0.3s; }
        .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background-color: white; border-radius: 50%; transition: transform 0.3s; }
        .toggle:checked { background-color: #10b981; }
        .toggle:checked::after { transform: translateX(22px); }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-6 md:p-12">
    
    <div class="max-w-5xl mx-auto glass rounded-3xl p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">Key Manager</h1>
                <p class="text-sm text-slate-400 mt-1">Control script access via SQLite database</p>
            </div>
            <button onclick="generateKey()" class="bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg shadow-orange-500/30">+ Generate Key</button>
        </div>

        <div id="loginSection">
            <input type="password" id="adminPass" placeholder="Enter Admin Password" class="w-full md:w-1/2 bg-slate-900/50 border border-slate-700 text-white p-4 rounded-xl mb-4 focus:outline-none focus:border-orange-500">
            <button onclick="login()" class="bg-slate-700 hover:bg-slate-600 px-8 py-4 rounded-xl font-bold">Login</button>
        </div>

        <div id="tableSection" class="hidden">
            <div class="overflow-x-auto rounded-xl border border-slate-700/50">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-800 text-slate-300 uppercase text-xs">
                        <tr>
                            <th class="px-6 py-4">License Key</th>
                            <th class="px-6 py-4 text-center">Status</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="keyTable" class="divide-y divide-slate-700/50 bg-slate-800/30">
                        <!-- Keys injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';
        let token = "";

        async function login() {
            const pass = document.getElementById('adminPass').value;
            const res = await fetch(`${API_URL}/admin/login`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pass})
            });
            const data = await res.json();
            if (data.status) {
                token = data.token;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('tableSection').classList.remove('hidden');
                fetchKeys();
            } else { alert("Wrong Password!"); }
        }

        async function fetchKeys() {
            const res = await fetch(`${API_URL}/admin/keys`, {
                headers: {'Authorization': `Bearer ${token}`}
            });
            const data = await res.json();
            const tbody = document.getElementById('keyTable');
            tbody.innerHTML = "";

            if (data.status && data.keys.length > 0) {
                data.keys.forEach(k => {
                    const isActive = k.status === 1;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-6 py-4 font-mono text-orange-400 font-bold">${k.key}</td>
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="toggle" ${isActive ? 'checked' : ''} onchange="toggleKey('${k.key}')">
                            <span class="ml-2 text-xs ${isActive ? 'text-emerald-400' : 'text-red-400'}">${isActive ? 'ACTIVE' : 'DISABLED'}</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="deleteKey('${k.key}')" class="text-slate-400 hover:text-red-400 text-xs px-3 py-1 rounded border border-slate-600 hover:border-red-400 transition-all">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-8 text-slate-500">No keys generated yet.</td></tr>`;
            }
        }

        async function generateKey() {
            if (!token) return alert("Please login first.");
            const res = await fetch(`${API_URL}/admin/create`, { method: 'POST', headers: {'Authorization': `Bearer ${token}`} });
            const data = await res.json();
            if (data.status) {
                alert(`✅ Key Generated:\n\n${data.key}`);
                fetchKeys();
            }
        }

        async function toggleKey(key) {
            await fetch(`${API_URL}/admin/toggle`, {
                method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                body: JSON.stringify({key: key})
            });
            fetchKeys();
        }

        async function deleteKey(key) {
            if (!confirm(`Delete key ${key} permanently?`)) return;
            await fetch(`${API_URL}/admin/delete`, {
                method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                body: JSON.stringify({key: key})
            });
            fetchKeys();
        }
    </script>
</body>
</html>
