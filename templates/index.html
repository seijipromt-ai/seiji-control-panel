<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEIJI | Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; background-image: radial-gradient(circle at top right, #1e1b4b 0%, transparent 40%), radial-gradient(circle at bottom left, #0f172a 0%, transparent 40%); }
        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .toggle-switch { appearance: none; width: 44px; height: 24px; background-color: #334155; border-radius: 24px; position: relative; cursor: pointer; outline: none; transition: all 0.3s; }
        .toggle-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background-color: white; border-radius: 50%; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toggle-switch:checked { background-color: #f97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }
        .toggle-switch:checked::after { transform: translateX(20px); }
        .glow-text { text-shadow: 0 0 10px rgba(249, 115, 22, 0.4); }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-6 antialiased">
    
    <div class="glass-panel w-full max-w-lg rounded-3xl p-8 relative overflow-hidden">
        <!-- Decorative gradients -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-orange-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        
        <!-- Header -->
        <div class="flex items-center gap-4 mb-8">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-2xl font-bold text-white shadow-lg shadow-orange-500/30">
                S
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white glow-text tracking-tight">SEIJI CONTROL</h1>
                <p class="text-xs text-slate-400 font-medium tracking-widest uppercase">Dashboard v2.0</p>
            </div>
        </div>
        
        <!-- License Input -->
        <div class="mb-8">
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">License Key</label>
            <div class="relative">
                <input type="text" id="keyInput" value="SEIJI-VIP-999" class="w-full bg-slate-900/50 border border-slate-700 text-orange-400 font-mono text-sm rounded-xl p-4 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all placeholder-slate-600" placeholder="Enter key...">
                <button onclick="loadConfig()" class="absolute right-2 top-2 bottom-2 px-4 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-lg border border-slate-600 transition-all">
                    Sync
                </button>
            </div>
        </div>

        <!-- Features Grid -->
        <div class="space-y-4">
            
            <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/40 border border-slate-700/50 hover:bg-slate-800/60 transition-all">
                <div class="flex flex-col">
                    <span class="font-semibold text-white">Kill / Stats Hack</span>
                    <span class="text-xs text-slate-400 mt-1">Modifies in-game stat pointers</span>
                </div>
                <input type="checkbox" id="kill" class="toggle-switch" onchange="updateFeature('kill', this.checked)">
            </div>
            
            <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/40 border border-slate-700/50 hover:bg-slate-800/60 transition-all">
                <div class="flex flex-col">
                    <span class="font-semibold text-white">Unlimited Gold</span>
                    <span class="text-xs text-slate-400 mt-1">Patches gold generation</span>
                </div>
                <input type="checkbox" id="gold" class="toggle-switch" onchange="updateFeature('gold', this.checked)">
            </div>
            
            <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/40 border border-slate-700/50 hover:bg-slate-800/60 transition-all">
                <div class="flex flex-col">
                    <span class="font-semibold text-white">Drone View</span>
                    <span class="text-xs text-slate-400 mt-1">Extends camera field of view</span>
                </div>
                <input type="checkbox" id="drone" class="toggle-switch" onchange="updateFeature('drone', this.checked)">
            </div>
            
            <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/40 border border-slate-700/50 hover:bg-slate-800/60 transition-all">
                <div class="flex flex-col">
                    <span class="font-semibold text-white">ACE Bypass</span>
                    <span class="text-xs text-slate-400 mt-1">Memory obfuscation protocols</span>
                </div>
                <input type="checkbox" id="bypass" class="toggle-switch" onchange="updateFeature('bypass', this.checked)">
            </div>

        </div>
        
        <!-- Status -->
        <div id="statusContainer" class="mt-6 text-center opacity-0 transition-opacity duration-300">
            <span id="statusText" class="text-sm font-medium"></span>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';

        async function loadConfig() {
            const key = document.getElementById('keyInput').value;
            try {
                const res = await fetch(`${API_URL}/config?key=${key}`);
                const data = await res.json();
                
                if (data.status) {
                    document.getElementById('kill').checked = data.features.kill;
                    document.getElementById('gold').checked = data.features.gold;
                    document.getElementById('drone').checked = data.features.drone;
                    document.getElementById('bypass').checked = data.features.bypass;
                    showStatus("Configuration Synced", false);
                } else {
                    showStatus("Invalid or Expired Key", true);
                }
            } catch (err) {
                showStatus("Connection failed", true);
            }
        }

        async function updateFeature(feature, state) {
            const key = document.getElementById('keyInput').value;
            try {
                const res = await fetch(`${API_URL}/update`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key: key, feature: feature, state: state})
                });
                const data = await res.json();
                if(data.status) showStatus(`${feature.toUpperCase()} is now ${state ? 'ENABLED' : 'DISABLED'}`, false);
            } catch (err) {
                showStatus("Failed to update", true);
            }
        }

        function showStatus(msg, isError) {
            const container = document.getElementById('statusContainer');
            const text = document.getElementById('statusText');
            
            text.innerText = msg;
            text.className = isError ? "text-sm font-medium text-red-400" : "text-sm font-medium text-emerald-400";
            
            container.classList.remove('opacity-0');
            setTimeout(() => container.classList.add('opacity-0'), 3000);
        }

        window.onload = loadConfig;
    </script>
</body>
</html>
