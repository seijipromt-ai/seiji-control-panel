<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Key Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a0b; --panel: #121216; --line: #1e1e24; --txt: #d8d8de; --dim: #6a6a76; --accent: #E88235; --mono: 'Inter', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: var(--mono); padding: 30px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
  h1 { font-size: 24px; color: #fff; }
  .logout { color: #ff5555; text-decoration: none; font-size: 14px; }
  .card { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 20px; }
  .form-row { display: flex; gap: 10px; align-items: center; }
  input[type="number"] { padding: 10px; background: #000; border: 1px solid var(--line); color: #fff; border-radius: 6px; outline: none; width: 100px; }
  button { padding: 10px 20px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  button:hover { filter: brightness(1.2); }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--dim); font-size: 12px; text-transform: uppercase; }
  .key { font-family: monospace; color: #22c55e; font-weight: bold; letter-spacing: 1px; }
  .status { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .status.active { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
  .status.expired { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
  .del-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .del-btn:hover { background: rgba(239, 68, 68, 0.1); }
</style>
</head>
<body>

<div class="header">
  <h1>🔐 Seiji Key Manager</h1>
  <a href="/logout" class="logout">Logout</a>
</div>

<div class="card">
  <h3>Generate New Key</h3>
  <br>
  <div class="form-row">
    <input type="number" id="days" value="30" min="1">
    <span style="color: var(--dim); font-size: 14px;">Days Valid</span>
    <button onclick="generateKey()">Generate Key</button>
  </div>
</div>

<div class="card">
  <h3>Active Keys</h3>
  <table>
    <thead>
      <tr>
        <th>Key</th>
        <th>Expiry Date</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="keyList">
      <tr><td colspan="4" style="text-align:center; color:var(--dim);">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
  async function loadKeys() {
    const res = await fetch('/api/keys');
    const data = await res.json();
    const tbody = document.getElementById('keyList');
    
    if(data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--dim);">No keys generated yet.</td></tr>';
      return;
    }

    tbody.innerHTML = data.map(k => `
      <tr>
        <td class="key">${k.key}</td>
        <td>${k.expiry}</td>
        <td><span class="status ${k.status}">${k.status.toUpperCase()}</span></td>
        <td><button class="del-btn" onclick="deleteKey('${k.key}')">REVOKE</button></td>
      </tr>
    `).join('');
  }

  async function generateKey() {
    const days = document.getElementById('days').value;
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ days: days })
    });
    const data = await res.json();
    if(data.ok) {
      alert("✅ KEY GENERATED:\n\n" + data.key);
      loadKeys();
    }
  }

  async function deleteKey(key) {
    if(!confirm("Revoke this key immediately?")) return;
    await fetch('/api/delete/' + key, { method: 'DELETE' });
    loadKeys();
  }

  loadKeys();
</script>
</body>
</html>
